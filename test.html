<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Div Example</title>
  <style>
    .container {
      position: relative; /* Establishes a positioning context */
      width: 300px;
      height: 200px;
      background-color: lightblue;
      margin: 50px auto;
    }

    .overlay {
      position: absolute; /* Positions the overlay absolutely within the container */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    This is the underlying div.
    <div class="overlay">
      Overlay Content
    </div>
  </div>
</body>
</html>
